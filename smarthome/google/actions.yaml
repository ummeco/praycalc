# praycalc/smarthome/google/actions.yaml — Google Actions configuration
# Spec §15.3, S19-G T34
#
# GCP project: GOOGLE_ACTIONS_PROJECT_ID (per D-S19-05: new "praycalc" project)
# Fulfillment endpoint: https://praycalc.com/api/actions/google
# Account linking: OAuth 2.0 via Ummat Auth (auth.ummat.dev)

actions:
  - name: actions.intent.MAIN
    fulfillment:
      webhook:
        handler:
          webhookHandler: main
    intent:
      name: actions.intent.MAIN
      trainingPhrases:
        - "Open PrayCalc"
        - "Talk to PrayCalc"
        - "Ask PrayCalc for prayer times"

intents:
  - name: prayer.times
    parameters:
      - name: City
        type:
          name: "actions.type.City"
    trainingPhrases:
      - "What time is the next prayer"
      - "When is the next salah"
      - "When is prayer time"
      - "What's the next prayer"
    fulfillment:
      webhook:
        handler:
          webhookHandler: prayer_times

  - name: prayer.all
    trainingPhrases:
      - "What are all the prayer times"
      - "Show me today's prayer times"
      - "Give me all prayer times for today"
      - "All prayers today"
    fulfillment:
      webhook:
        handler:
          webhookHandler: all_prayers

  - name: prayer.specific
    parameters:
      - name: Prayer
        type:
          name: prayer.type
    trainingPhrases:
      - "When is Fajr"
      - "What time is Asr"
      - "When is Maghrib prayer"
      - "What time is Isha"
      - "When is Dhuhr"
    fulfillment:
      webhook:
        handler:
          webhookHandler: prayer_times

  - name: qibla.direction
    trainingPhrases:
      - "What direction is Qibla"
      - "Which way is Mecca"
      - "Show me the Qibla direction"
      - "Where is the Kaaba"
    fulfillment:
      webhook:
        handler:
          webhookHandler: qibla_query

  - name: location.set
    parameters:
      - name: City
        type:
          name: "actions.type.City"
        required: true
    trainingPhrases:
      - "Set my location to London"
      - "Use New York for prayer times"
      - "Change location to Dubai"
      - "My city is Istanbul"
    fulfillment:
      webhook:
        handler:
          webhookHandler: set_location

types:
  - name: prayer.type
    synonym:
      acceptOutOfVocabulary: false
      entries:
        - synonyms: ["Fajr", "Fajir", "dawn prayer"]
          display: Fajr
        - synonyms: ["Dhuhr", "Dhuhur", "Zuhr", "midday prayer", "noon prayer"]
          display: Dhuhr
        - synonyms: ["Asr", "Asar", "afternoon prayer"]
          display: Asr
        - synonyms: ["Maghrib", "Maghrab", "sunset prayer", "evening prayer"]
          display: Maghrib
        - synonyms: ["Isha", "Isha'a", "night prayer", "night salah"]
          display: Isha

webhooks:
  - name: praycalc_fulfillment
    httpsEndpoint:
      baseUrl: "https://praycalc.com/api/actions/google"

accountLinking:
  enableAccountCreation: true
  linkingType: OAUTH
  authGrantType: AUTH_CODE
  clientId: "${GOOGLE_ACTIONS_CLIENT_ID}"
  clientSecret: "${GOOGLE_ACTIONS_CLIENT_SECRET}"
  authorizationUrl: "https://auth.ummat.dev/oauth/authorize"
  tokenUrl: "https://auth.ummat.dev/oauth/token"
  scopes:
    - profile
    - "praycalc:prayer-times"
  privacyPolicyUrl: "https://praycalc.com/privacy"

settings:
  projectId: "${GOOGLE_ACTIONS_PROJECT_ID}"
  defaultLocale: en
  enabledRegions:
    - "en-US"
    - "en-GB"
    - "en-IN"
    - "en-AU"
  localizedSettings:
    displayName: "PrayCalc"
    pronunciation: "Pray Calc"
    shortDescription: "Accurate Islamic prayer times and Qibla direction"
    fullDescription: >
      PrayCalc provides GPS-accurate prayer times for all 5 daily prayers,
      supports 10+ calculation methods, and gives the Qibla direction from
      anywhere in the world. Ask for today's prayer times, a specific prayer,
      or the Qibla direction.
    smallLogoImage: "https://praycalc.com/assets/google-action-icon-192.png"
    largeLandscapeImage: "https://praycalc.com/assets/google-action-banner-1920x1080.png"
    developerName: "Ummeco"
    developerEmail: "dev@praycalc.com"
    termsOfServiceUrl: "https://praycalc.com/terms"
    privacyPolicyUrl: "https://praycalc.com/privacy"
    sampleInvocations:
      - "Talk to PrayCalc"
      - "Ask PrayCalc when is Asr"
      - "Ask PrayCalc for all prayer times"
