rules:
  - id: no-vite-admin-secret
    patterns:
      - pattern-regex: '(VITE_|NEXT_PUBLIC_|EXPO_PUBLIC_)[A-Z_]*ADMIN[A-Z_]*'
    message: >
      Public env var contains ADMIN in the name (ADR-008: no-vite-admin-secret).
      VITE_*, NEXT_PUBLIC_*, and EXPO_PUBLIC_* vars are bundled into the client.
      Admin secrets must NEVER be exposed client-side.
      Use server-side env vars or Hasura Auth JWT claims.
      Rampart: CRITICAL — blocks merge.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      adr: ADR-008
      rampart: "CRITICAL"
      category: security
      rampart-label: rampart-crit
      ticket: P2-E1-W01-S01-T02
    paths:
      include:
        - "web/**"
