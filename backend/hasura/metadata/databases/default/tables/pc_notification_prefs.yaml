table:
  name: pc_notification_prefs
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - device_id
        - prayer
        - at_adhan
        - pre_reminder_minutes
        - sound
        - vibrate
        - enabled
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - device_id:
              _eq: X-Hasura-Device-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      columns:
        - device_id
        - user_id
        - prayer
        - at_adhan
        - pre_reminder_minutes
        - sound
        - vibrate
        - enabled
      check:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - user_id:
              _is_null: true
  - role: admin
    permission:
      columns: "*"
      check: {}
update_permissions:
  - role: user
    permission:
      columns:
        - at_adhan
        - pre_reminder_minutes
        - sound
        - vibrate
        - enabled
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - device_id:
              _eq: X-Hasura-Device-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
