# Canonical baseline — see .github/docs/mobile-snippets/analysis_options_canonical.yaml
# and .github/docs/mobile-architecture.md §17.
#
# Sprint Q-MOB T28 lands this baseline. Pre-existing findings from the legacy
# flat structure may surface; address per T14/T17/T18/T24 rather than
# weakening this file. custom_lint plugin runs riverpod_lint rules in CI.

include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "build/**"

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    avoid_print: true
    use_super_parameters: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_pub_dependencies: true
    unnecessary_lambdas: true
    unnecessary_const: true
    unnecessary_new: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
