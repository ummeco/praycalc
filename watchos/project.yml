name: PrayCalc
# PrayCalc watchOS — generated by XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Source of truth: this file. The generated PrayCalc.xcodeproj is gitignored;
# run `xcodegen generate` from watchos/ to (re)create it.
#
# Two targets:
#   PrayCalcWatch        — the SwiftUI watchOS app
#   PrayCalcComplication — the WidgetKit extension (watch-face complications)
# The shared C core (../core/c) + Swift bridge + data models are compiled into
# BOTH targets so the complication computes prayer times fully offline.

options:
  bundleIdPrefix: com.praycalc
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # C core lives two levels up from watchos/. Header search path lets the
    # bridging header resolve <nrel_spa.h>/<pray_calc.h>/<qibla.h> if needed.
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../core/c"
    GCC_C_LANGUAGE_STANDARD: c99
    CLANG_ENABLE_MODULES: YES

# ---------------------------------------------------------------------------
# Reusable file groups — the C core + the Swift files shared app<->widget.
# XcodeGen inlines these under each target's `sources`.
# ---------------------------------------------------------------------------

targets:
  PrayCalcWatch:
    type: application
    platform: watchOS
    sources:
      - path: PrayCalcWatch/PrayCalcWatchApp.swift
      - path: PrayCalcWatch/ContentView.swift
      - path: PrayCalcWatch/Models
      - path: PrayCalcWatch/Services
      - path: PrayCalcWatch/Views
      - path: PrayCalcWatch/Bridge/PrayCalcEngine.swift
      - path: PrayCalcWatch/Bridge/SharedLocationStore.swift
      - path: PrayCalcWatch/Assets.xcassets
      # Shared C core (referenced in place, two levels up).
      - path: ../core/c/nrel_spa.c
        group: CoreC
      - path: ../core/c/pray_calc.c
        group: CoreC
      - path: ../core/c/qibla.c
        group: CoreC
      - path: ../core/c/nrel_spa.h
        group: CoreC
      - path: ../core/c/pray_calc.h
        group: CoreC
      - path: ../core/c/qibla.h
        group: CoreC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praycalc.watch
        INFOPLIST_FILE: PrayCalcWatch/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: PrayCalcWatch/Bridge/PrayCalcWatch-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: PrayCalcWatch/PrayCalcWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PrayCalcComplication

  PrayCalcComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: PrayCalcWatch/Complications
      # Widget must compute offline too: share the engine, data models, C core.
      - path: PrayCalcWatch/Bridge/PrayCalcEngine.swift
      - path: PrayCalcWatch/Bridge/SharedLocationStore.swift
      - path: PrayCalcWatch/Models/PrayerData.swift
      - path: PrayCalcWatch/Assets.xcassets
      - path: ../core/c/nrel_spa.c
        group: CoreC
      - path: ../core/c/pray_calc.c
        group: CoreC
      - path: ../core/c/qibla.c
        group: CoreC
      - path: ../core/c/nrel_spa.h
        group: CoreC
      - path: ../core/c/pray_calc.h
        group: CoreC
      - path: ../core/c/qibla.h
        group: CoreC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praycalc.watch.complication
        INFOPLIST_FILE: PrayCalcComplication/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: PrayCalcWatch/Bridge/PrayCalcWatch-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: PrayCalcComplication/PrayCalcComplication.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PrayCalcWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
    dependencies:
      - target: PrayCalcWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PrayCalcWatch:
    build:
      targets:
        PrayCalcWatch: all
        PrayCalcComplication: all
    test:
      targets:
        - PrayCalcWatchTests
