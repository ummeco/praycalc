name: Wear OS CI

on:
  push:
    branches: [main]
    paths: ['wearos/**']
  pull_request:
    branches: [main]
    paths: ['wearos/**']
  workflow_dispatch:

jobs:
  build:
    name: Build Wear OS App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('wearos/**/*.gradle*', 'wearos/**/gradle-wrapper.properties') }}

      - name: Build Release APK
        working-directory: wearos
        run: ./gradlew assembleRelease --no-daemon

      - name: Run unit tests
        working-directory: wearos
        run: ./gradlew test --no-daemon
