name: PrayCalc CI

on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  ci:
    name: Type Check, Build & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: "Audit: no HIGH/CRITICAL CVEs (allowlist-gated)"
        run: |
          pnpm audit --audit-level=high --json > audit-report.json 2>&1 || true
          node ../.github/scripts/audit-allowlist.js audit-report.json .audit-allowlist.json
      - name: Unit tests (with coverage thresholds)
        run: pnpm test:coverage
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: "Install: Playwright Chromium"
        run: pnpm exec playwright install --with-deps chromium
      - name: "Install: Playwright WebKit"
        run: pnpm exec playwright install webkit --with-deps
      - name: Run E2E tests
        # Blocking gate. The Playwright suite (homepage, city-page, settings, rtl,
        # account) was realigned to the Astro island DOM and the dropped Next.js
        # feature surface was rebuilt (account, calendar modals, settings panel,
        # Qibla/moon/geo-prompt, cookie-RTL). Full matrix green across chromium,
        # mobile-375 (WebKit), tablet-768, desktop-1280.
        run: pnpm test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
