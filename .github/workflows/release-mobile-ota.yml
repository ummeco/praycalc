name: Publish Mobile OTA Update (EAS Update)

# Every mobile-v* tag (and manual dispatch) publishes the JS bundle as an EAS
# Update to the production channel. Installed apps — store builds AND the
# GitHub direct-install APK — download it silently in the background on next
# launch and apply it on the launch after that (expo-updates ON_LOAD +
# fallbackToCacheTimeout 0). No user action, no store review.
#
# runtimeVersion policy is "appVersion": an update published from version X.Y.Z
# only reaches binaries built from X.Y.Z, so an OTA bundle can never land on a
# binary whose native modules don't match. Native-module changes are the ONLY
# thing that still requires a store upload.
#
# Activation: paste the real EXPO_TOKEN repo secret and replace
# UD-PENDING-EAS-PROJECT-ID in mobile/app.json (see .github/docs/CREDENTIALS.md).
# Until then this workflow no-ops. It does NOT fail the run (a missing optional credential
# is not a broken build), but it raises a WARNING annotation and writes a job summary so a
# skipped publish is visible on the run page rather than buried in the step log.

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-update:
    name: eas update → production channel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Check activation (EXPO_TOKEN + real projectId)
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # A skip is reported as a WARNING, not a notice, and is restated in the job
          # summary. A tag push that silently no-ops while the run goes green is how a
          # release gets believed to have shipped when it did not: mobile-v2.2.3 and
          # v2.2.4 both "succeeded" here having published nothing, and the gap was only
          # caught by reading the logs by hand.
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning title=OTA NOT PUBLISHED::EXPO_TOKEN secret is not set. This tag shipped NO over-the-air update — users only get the fix by installing the APK from GitHub Releases. Paste the secret per .github/docs/CREDENTIALS.md to activate."
            {
              echo "## OTA update was NOT published"
              echo ""
              echo "\`EXPO_TOKEN\` is not set, so \`${GITHUB_REF_NAME:-this run}\` published no over-the-air update."
              echo ""
              echo "Existing installs will **not** receive this release. They can only get it by"
              echo "installing the APK attached to the GitHub Release, or from a store build."
              echo ""
              echo "To activate: see \`.github/docs/CREDENTIALS.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -q "UD-PENDING-EAS-PROJECT-ID" app.json; then
            echo "::warning title=OTA NOT PUBLISHED::mobile/app.json still has the placeholder EAS projectId. This tag shipped NO over-the-air update."
            {
              echo "## OTA update was NOT published"
              echo ""
              echo "\`mobile/app.json\` still contains the placeholder EAS projectId, so"
              echo "\`${GITHUB_REF_NAME:-this run}\` published no over-the-air update."
              echo ""
              echo "To activate: see \`.github/docs/CREDENTIALS.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Install JS dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Publish EAS Update
        if: steps.gate.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli update --channel production --non-interactive \
            --message "${GITHUB_REF_NAME:-manual}: $(git log -1 --pretty=%s)"
