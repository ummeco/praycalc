name: Release PrayCalc TV (EAS Build + Submit)

# Manual-only store submission lane: run from the Actions tab (workflow_dispatch) to build
# via EAS and submit to the Google Play (Android TV listing) and tvOS App Store.
#
# GitHub direct-install APK releases (Fire TV / Android TV sideload) are handled by
# release-tv-apk.yml (`tv-v*` tags) — a bare Gradle build, no EAS account needed. This
# workflow used to ALSO run on `tv-v*` tag push (the "one asymmetry" vs. mobile the
# provisioning runbook used to call out); that asymmetry is now closed — TV mirrors
# mobile's split exactly: tag push → direct-install APK, manual dispatch → EAS/store.
#
# tv/ is a BARE (non-Expo) react-native-tvos project — EAS Build supports bare workflow
# projects directly via the committed ios/ + android/ folders, no Expo config needed.
# There is no "tvos" platform value in EAS; the Apple TV target is built via the regular
# `ios` platform using the `PrayCalcTV-tvOS` Xcode scheme set in tv/eas.json (the ONLY
# scheme configured for every profile in that file) — so `platform: ios` below always
# means "build the tvOS app," never a phone/tablet target. EAS's support for tvOS schemes
# specifically is less battle-tested than iPhone/iPad builds — if a build fails in a way
# that looks EAS-specific (not a project bug), the documented fallback is a direct
# macOS-runner job using xcodebuild + fastlane instead of EAS for the iOS/tvOS leg only
# (Android TV via EAS is the well-supported path and unaffected by this caveat).
#
# Amazon Appstore (Fire TV) has no EAS Submit integration and no automated lane in THIS
# workflow at all — Amazon reviewers accept a plain signed APK, so use the
# release-tv-apk.yml GitHub Release artifact for manual submission via the Amazon
# Developer Console instead (see fire-tv-submission.md). This workflow used to fetch an
# ad hoc EAS-built Android artifact for that purpose; see the trailing comment below for
# why that was removed.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'ios', 'android']
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options: ['production', 'preview']
      submit:
        description: 'Auto-submit to App Store / Play Store after build (Amazon Appstore is always manual)'
        required: true
        default: true
        type: boolean

concurrency:
  group: release-tv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS Build + Submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tv
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        if: ${{ github.event.inputs.submit != 'false' }}
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" | base64 -d > asc-api-key.p8

      - name: Write Google Play service account key
        if: ${{ github.event.inputs.submit != 'false' }}
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_TV }}' > google-service-account.json

      - name: EAS Build (+ submit)
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
          DO_SUBMIT: ${{ github.event.inputs.submit || 'true' }}
        run: |
          SUBMIT_FLAG=""
          if [ "$DO_SUBMIT" = "true" ]; then
            SUBMIT_FLAG="--auto-submit"
          fi
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --wait $SUBMIT_FLAG

      - name: Clean up credential files
        if: always()
        run: rm -f asc-api-key.p8 google-service-account.json

      # Amazon Appstore (Fire TV) submission no longer sources its APK from this workflow.
      # It used to (a "Fetch Android build APK" step uploaded whatever EAS's android build
      # produced as a workflow artifact), but that was unreliable — the `production` EAS
      # profile's android.buildType is `aab` (for Play Store), not `apk`, so the fetched
      # artifact was only actually an APK when someone ran this manually with the `preview`
      # profile. release-tv-apk.yml now produces a real, correctly-named, checksummed,
      # versioned signed APK on every `tv-v*` tag via a plain Gradle build — use that
      # GitHub Release asset for Amazon submission instead (see fire-tv-submission.md).
