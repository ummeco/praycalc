# Branch Name Validator — praycalc
# Sprint Q-CHARTER T14 | charter § 18 enforcement
# Validates branch names. Conventional-commit prefixes and dependabot branches
# always pass. Anything else is a non-blocking warning (never fails the check) —
# a naming gate must never block merges org-wide.
# Exempts: main, master, develop, release/*, hotfix/*, and Dependabot branches.

name: Branch Name

on:
  push:
    branches-ignore:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'dependabot/**'

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"

          # Dependabot branches always pass.
          if echo "$BRANCH" | grep -qE '^dependabot/'; then
            echo "Branch name OK (dependabot): $BRANCH"
            exit 0
          fi

          # Conventional prefix + kebab-case slug (ticket-ID suffix optional).
          if echo "$BRANCH" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|security|ci|build)/[a-z0-9][a-z0-9-]*$'; then
            echo "Branch name OK: $BRANCH"
            exit 0
          fi

          # Anything else: warn, don't block. A branch-naming gate should never
          # fail the whole PR — surface it as an annotation instead.
          echo "::warning::Branch name '$BRANCH' doesn't match the conventional pattern <type>/kebab-case-slug."
          echo "::warning::Preferred: <type>/T-PN-NN-short-slug (see ENGINEERING-CHARTER.md § 18), but any <type>/kebab-case name is accepted."
          echo "::warning::Example: feat/T-P7-Q-CHARTER-07-eslint-plugin or fix/rampart-warn-mode"
          exit 0
