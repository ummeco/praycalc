name: Build Tauri Desktop App

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/ci-desktop.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/ci-desktop.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-desktop:
    name: Build Tauri Desktop App
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build Vite frontend
        run: pnpm build

      - name: Cargo check (Rust)
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
