name: Build Tauri Desktop App

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/ci-desktop.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/ci-desktop.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-desktop:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            targets: aarch64-apple-darwin
            label: macOS (arm64)
          - platform: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - platform: windows-latest
            targets: x86_64-pc-windows-msvc
            label: Windows (x64)

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install LLVM (Windows — needed by vswhom-sys build script)
        if: matrix.platform == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build Vite frontend
        run: pnpm build

      - name: Cargo check (Rust)
        if: matrix.platform != 'windows-latest'
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.targets }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: praycalc-${{ runner.os }}
          path: |
            desktop/src-tauri/target/${{ matrix.targets }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.targets }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.targets }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.targets }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.targets }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
