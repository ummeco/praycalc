name: Release

# Triggered by: git tag v1.2.0 && git push origin v1.2.0
# Produces a GitHub Release with signed/packaged artifacts for every platform.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON          — base64-encoded google-services.json
#   GOOGLE_SERVICE_INFO_PLIST     — base64-encoded GoogleService-Info.plist
#   SHOREBIRD_TOKEN               — from `shorebird login`
#   IOS_CERTIFICATES_P12          — base64-encoded Distribution cert (.p12)
#   IOS_CERTIFICATES_P12_PASSWORD — password for the .p12
#   IOS_PROVISIONING_PROFILE      — base64-encoded .mobileprovision
#   KEYCHAIN_PASSWORD             — any strong random string (temp keychain)
#   MACOS_CERTIFICATES_P12        — base64-encoded Developer ID Application cert
#   MACOS_CERTIFICATES_P12_PASSWORD
#   MACOS_KEYCHAIN_PASSWORD
#   APPLE_ID                      — your Apple ID email (for notarization)
#   APPLE_TEAM_ID                 — 10-char team ID from developer.apple.com
#   APPLE_APP_PASSWORD            — app-specific password from appleid.apple.com

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Gate: analyze + test before any build
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Get pray_calc_dart dependencies
        working-directory: flutter/packages/pray_calc_dart
        run: dart pub get
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Validate pray_calc_dart VERSION
        working-directory: flutter/packages/pray_calc_dart
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          P=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          [ "$V" = "$P" ] || { echo "VERSION $V != pubspec $P"; exit 1; }
      - name: Tests
        working-directory: flutter
        run: flutter test

  # ─────────────────────────────────────────────────────────────────
  # Android — Shorebird release + Amazon APK
  # ─────────────────────────────────────────────────────────────────
  release-android:
    name: Android (Google Play + Amazon)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > flutter/android/app/google-services.json
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Shorebird release Android (Google Play)
        # Non-fatal: requires a valid SHOREBIRD_TOKEN secret.
        # Run `shorebird login:ci` locally, copy the token, set it as the
        # SHOREBIRD_TOKEN secret in GitHub → Settings → Secrets and variables → Actions.
        continue-on-error: true
        working-directory: flutter
        run: shorebird release android --flavor google -t lib/main.dart
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Build Amazon APK
        if: always()
        working-directory: flutter
        run: |
          flutter build apk \
            --flavor amazon \
            --target lib/main.dart \
            --dart-define=FLAVOR=amazon \
            --release \
            --no-tree-shake-icons
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: flutter/build/app/outputs/bundle/googleRelease/app-google-release.aab
      - name: Upload Amazon APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-amazon-apk
          path: flutter/build/app/outputs/flutter-apk/app-amazon-release.apk

  # ─────────────────────────────────────────────────────────────────
  # iOS — Shorebird release (signed if certs present, else unsigned)
  # ─────────────────────────────────────────────────────────────────
  release-ios:
    name: iOS (App Store)
    runs-on: macos-latest
    needs: test
    env:
      HAS_IOS_CERT: ${{ secrets.IOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Inject GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > flutter/ios/Runner/GoogleService-Info.plist
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Install signing certificate
        if: env.HAS_IOS_CERT == 'true'
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KP=$RUNNER_TEMP/signing.keychain-db
          echo -n "${{ secrets.IOS_CERTIFICATES_P12 }}" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KP"
          security set-keychain-settings -lut 21600 "$KP"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KP"
          security import "$CERT_PATH" -P "${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}" -A -t cert -f pkcs12 -k "$KP"
          security list-keychain -d user -s "$KP"
      - name: Install provisioning profile
        if: env.HAS_IOS_CERT == 'true'
        run: |
          PP=$RUNNER_TEMP/build.mobileprovision
          echo -n "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode -o "$PP"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Shorebird release iOS (signed)
        if: env.HAS_IOS_CERT == 'true'
        working-directory: flutter
        run: shorebird release ios
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Build iOS unsigned (no cert — compile verification only)
        if: env.HAS_IOS_CERT != 'true'
        working-directory: flutter
        run: flutter build ios --no-codesign --release

  # ─────────────────────────────────────────────────────────────────
  # macOS — Release build packaged as DMG
  # ─────────────────────────────────────────────────────────────────
  release-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    needs: test
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Install Developer ID certificate
        if: env.HAS_MACOS_CERT == 'true'
        run: |
          CERT_PATH=$RUNNER_TEMP/devid.p12
          KP=$RUNNER_TEMP/macos-signing.keychain-db
          echo -n "${{ secrets.MACOS_CERTIFICATES_P12 }}" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" "$KP"
          security set-keychain-settings -lut 21600 "$KP"
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" "$KP"
          security import "$CERT_PATH" -P "${{ secrets.MACOS_CERTIFICATES_P12_PASSWORD }}" -A -t cert -f pkcs12 -k "$KP"
          security list-keychain -d user -s "$KP"
      - name: Build macOS (release)
        working-directory: flutter
        run: flutter build macos --release
      - name: Sign app (Developer ID)
        if: env.HAS_MACOS_CERT == 'true'
        run: |
          codesign --deep --force --verify --verbose \
            --options runtime \
            --sign "Developer ID Application" \
            flutter/build/macos/Build/Products/Release/praycalc_app.app
      - name: Package as DMG
        run: |
          APP=flutter/build/macos/Build/Products/Release/praycalc_app.app
          mkdir -p /tmp/dmg-stage
          cp -R "$APP" /tmp/dmg-stage/PrayCalc.app
          ln -s /Applications /tmp/dmg-stage/Applications
          hdiutil create -volname "PrayCalc" \
            -srcfolder /tmp/dmg-stage \
            -ov -format UDZO \
            /tmp/PrayCalc.dmg
          rm -rf /tmp/dmg-stage
      - name: Notarize DMG
        if: env.HAS_MACOS_CERT == 'true'
        run: |
          xcrun notarytool submit /tmp/PrayCalc.dmg \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --wait
          xcrun stapler staple /tmp/PrayCalc.dmg
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: /tmp/PrayCalc.dmg

  # ─────────────────────────────────────────────────────────────────
  # Windows — Release build packaged as ZIP
  # ─────────────────────────────────────────────────────────────────
  release-windows:
    name: Windows (ZIP)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build Windows (release)
        working-directory: flutter
        run: flutter build windows --release
      - name: Package as ZIP
        shell: pwsh
        run: |
          $src = "flutter\build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "$env:RUNNER_TEMP\PrayCalc-Windows.zip"
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: ${{ runner.temp }}/PrayCalc-Windows.zip

  # ─────────────────────────────────────────────────────────────────
  # Linux — Release build packaged as .deb + .tar.gz
  # ─────────────────────────────────────────────────────────────────
  release-linux:
    name: Linux (.deb + tar.gz)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libcurl4-openssl-dev \
            libayatana-appindicator3-dev
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Patch flutter_secure_storage_linux (cmake pkg_check_modules workaround)
        # cmake's FindPkgConfig.cmake has a regression where pkg_check_modules fails
        # with version specifiers (>=) due to ARGN being semicolon-joined in if().
        # Replace the plugin's CMakeLists.txt with a find_library-based version.
        run: |
          cp flutter/linux/patches/flutter_secure_storage_linux_CMakeLists.txt \
            flutter/linux/flutter/ephemeral/.plugin_symlinks/flutter_secure_storage_linux/linux/CMakeLists.txt
      - name: Build Linux (release)
        working-directory: flutter
        run: flutter build linux --release
      - name: Get version
        id: ver
        run: echo "version=$(grep '^version:' flutter/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)" >> $GITHUB_OUTPUT
      - name: Package .tar.gz
        run: |
          cd flutter/build/linux/x64/release/bundle
          tar -czf /tmp/PrayCalc-Linux.tar.gz .
      - name: Package .deb
        run: |
          VER=${{ steps.ver.outputs.version }}
          PKG=/tmp/praycalc_${VER}_amd64
          BUNDLE=flutter/build/linux/x64/release/bundle

          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/praycalc" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -r "$BUNDLE/." "$PKG/usr/lib/praycalc/"

          printf '#!/bin/bash\nexec /usr/lib/praycalc/praycalc_app "$@"\n' > "$PKG/usr/bin/praycalc"
          chmod +x "$PKG/usr/bin/praycalc"

          printf '[Desktop Entry]\nName=PrayCalc\nComment=Islamic Prayer Times\nExec=praycalc\nIcon=praycalc\nType=Application\nCategories=Education;Utility;\n' \
            > "$PKG/usr/share/applications/praycalc.desktop"

          printf 'Package: praycalc\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Ummeco <apps@ummat.dev>\nDescription: PrayCalc - Islamic Prayer Times\n Accurate prayer times, Qibla, adhan reminders, and TV display mode.\n' \
            "$VER" > "$PKG/DEBIAN/control"

          dpkg-deb --build "$PKG" /tmp/praycalc_${VER}_amd64.deb
      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-targz
          path: /tmp/PrayCalc-Linux.tar.gz
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: /tmp/praycalc_${{ steps.ver.outputs.version }}_amd64.deb

  # ─────────────────────────────────────────────────────────────────
  # Smart server Docker image → ghcr.io
  # ─────────────────────────────────────────────────────────────────
  release-smart:
    name: Smart Server (Docker)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: ver
        run: echo "version=$(node -p "require('./smart/package.json').version")" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v7
        with:
          context: smart
          push: true
          tags: |
            ghcr.io/ummeco/praycalc-smart:latest
            ghcr.io/ummeco/praycalc-smart:${{ steps.ver.outputs.version }}

  # ─────────────────────────────────────────────────────────────────
  # CycloneDX SBOM — web (npm)
  # ─────────────────────────────────────────────────────────────────
  sbom-web:
    name: SBOM (web/npm)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-npm-buildplugin@v1
        with:
          working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-web
          path: web/bom.xml
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────
  # GitHub Release — collect artifacts + publish
  # ─────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-android
      - release-ios
      - release-macos
      - release-windows
      - release-linux
      - release-smart
      - sbom-web
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/release-artifacts
      - name: Get version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## ${VERSION}/,/^## [0-9]/" .github/docs/changelog.md | head -n -1 | tail -n +2)
          printf 'notes<<ENDOFNOTES\n%s\nENDOFNOTES\n' "$NOTES" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: PrayCalc ${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            /tmp/release-artifacts/android-aab/*.aab
            /tmp/release-artifacts/android-amazon-apk/*.apk
            /tmp/release-artifacts/macos-dmg/*.dmg
            /tmp/release-artifacts/windows-zip/*.zip
            /tmp/release-artifacts/linux-deb/*.deb
            /tmp/release-artifacts/linux-targz/*.tar.gz
            /tmp/release-artifacts/sbom-web/*.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
