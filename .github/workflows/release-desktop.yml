name: Release Tauri Desktop App

# Push a `desktop-v*` tag (e.g. desktop-v1.1.0) → build every platform and
# publish ONE GitHub release with all installers attached:
#   macOS  .dmg + .app.tar.gz     Windows  .msi + .exe     Linux  .deb + .AppImage
#
# Three-job pipeline (the official tauri-action multi-platform pattern — see
# tauri-apps/tauri-action's examples/publish-to-manual-release.yml):
#   1. create-release  — creates ONE draft release up front, outputs its release_id.
#   2. release-tauri-desktop (matrix) — each platform leg uploads installers to that
#      SAME release via `releaseId` (no per-leg get-or-create, so there is no creation
#      race and no last-writer-wins clobbering of latest.json while it's still assembling
#      — see incident: run 29056489413 (desktop-v1.2.3) went live ~12 minutes before its
#      final latest.json had all platforms merged in, because a failed+rerun macOS leg
#      republished the manifest mid-flight under the old single-job design).
#   3. publish-release — after every leg succeeds, flips the release from draft to
#      published, then republishes latest.json to the rolling `desktop-latest` release
#      (a stable, non-"latest"-marked alias the in-app updater polls — see UPD-1 —
#      so a future non-desktop GitHub release, e.g. a whole-platform "v3.x" marker
#      release, can never steal GitHub's global "latest" slug out from under the
#      updater feed the way `releases/latest/download/latest.json` could).
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches tauri.conf.json version
        # Tagging desktop-v1.3.0 without bumping tauri.conf.json would otherwise publish
        # a release named 1.3.0 containing 1.2.x installers and a latest.json that lies
        # about its own version — fail fast instead (REL-06).
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match desktop/src-tauri/tauri.conf.json version ($CONF_VERSION)"
            exit 1
          fi
          echo "Version check passed: tag=$TAG_VERSION conf=$CONF_VERSION"
        working-directory: desktop

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const displayVersion = tag.replace(/^desktop-/, '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `PrayCalc Desktop ${displayVersion}`,
              body: 'Menu bar / system tray prayer-time app for macOS, Windows, and Linux. Download the installer for your platform below.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  release-tauri-desktop:
    name: Release (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            targets: aarch64-apple-darwin
            label: macOS (arm64)
          - platform: macos-15
            targets: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - platform: windows-latest
            targets: x86_64-pc-windows-msvc
            label: Windows (x64)

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install LLVM (Windows — needed by vswhom-sys build script)
        if: matrix.platform == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-release-
            ${{ runner.os }}-tauri-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app + upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # TAURI_SIGNING_PRIVATE_KEY is configured, so releases build SIGNED updater
          # artifacts (.sig per installer + latest.json) that the in-app auto-updater
          # verifies against the pubkey in tauri.conf.json — enabling seamless auto-update.
          # Base config keeps createUpdaterArtifacts off (so the unsigned on-push CI smoke
          # build stays green); this override turns it on for signed releases only.
          args: '--target ${{ matrix.targets }} --config {"bundle":{"createUpdaterArtifacts":true}}'
          # releaseId (not tagName/releaseDraft) — every leg uploads assets to the SAME
          # draft release created above instead of each independently finding-or-creating
          # one, which is what caused the creation/merge race this pipeline used to have.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true

  publish-release:
    name: Publish release + update desktop-latest
    needs: [create-release, release-tauri-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Flip the draft release to published
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false,
            });

      - name: Download latest.json from the versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment rather than interpolated into the script.
          # `${{ }}` expansion happens before the shell runs, so a crafted ref name would
          # be substituted as literal script text (semgrep run-shell-injection).
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/desktop-latest
          gh release download "$REF_NAME" \
            --repo "$REPO" \
            --pattern latest.json \
            --dir /tmp/desktop-latest \
            --clobber

      - name: Ensure the rolling desktop-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view desktop-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create desktop-latest \
              --repo "$REPO" \
              --title 'Desktop auto-update manifest (rolling)' \
              --notes 'Rolling alias, not a downloadable release. Hosts only the stable
          latest.json the in-app updater polls at
          releases/download/desktop-latest/latest.json — immune to GitHub repo-wide
          "latest release" reassignment from unrelated (non-desktop) releases. Get
          installers from the versioned desktop-v* release instead.' \
              --latest=false
          fi

      - name: Publish latest.json to the desktop-latest rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload desktop-latest /tmp/desktop-latest/latest.json \
            --repo "$REPO" \
            --clobber
