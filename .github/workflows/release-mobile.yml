name: Release PrayCalc Mobile (EAS Build + Submit)

# Two ways to ship a mobile build:
#   1. Push a `mobile-v*` tag (e.g. mobile-v2.0.1) → production profile, all platforms, auto-submit.
#   2. Run manually (workflow_dispatch) → pick platform/profile/submit yourself (e.g. an iOS-only
#      preview build for TestFlight internal testing without touching production).
#
# iOS/Android signing credentials live in EAS's own credential store (provisioned once via
# `eas credentials` — see .github/docs/runbooks/mobile-tv-release-provisioning.md). This workflow
# only needs EXPO_TOKEN plus the two store-submission secrets. No .p12/.keystore ever touches GitHub.
on:
  # Manual-only until the team provisions EXPO_TOKEN + store credentials.
  # GitHub direct-install APK releases are handled by release-mobile-apk.yml (mobile-v* tags).
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'ios', 'android']
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options: ['production', 'preview']
      submit:
        description: 'Auto-submit to App Store / Play Store after build'
        required: true
        default: true
        type: boolean

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS Build + Submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches app.json version
        # Only meaningful for tag-triggered runs — a manual workflow_dispatch run has no
        # tag and always builds whatever app.json currently says (REL-06).
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mobile-v}"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match mobile/app.json expo.version ($APP_VERSION)"
            exit 1
          fi
          echo "Version check passed: tag=$TAG_VERSION app.json=$APP_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        if: ${{ github.event.inputs.submit != 'false' }}
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" | base64 -d > asc-api-key.p8

      - name: Write Google Play service account key
        if: ${{ github.event.inputs.submit != 'false' }}
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: EAS Build (+ submit)
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
          DO_SUBMIT: ${{ github.event.inputs.submit || 'true' }}
        run: |
          SUBMIT_FLAG=""
          if [ "$DO_SUBMIT" = "true" ]; then
            SUBMIT_FLAG="--auto-submit"
          fi
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --wait $SUBMIT_FLAG

      - name: Clean up credential files
        if: always()
        run: rm -f asc-api-key.p8 google-service-account.json
