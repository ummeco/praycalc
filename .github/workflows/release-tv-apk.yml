name: Release TV Android APK (GitHub direct-install)

# Push a `tv-v*` tag (e.g. tv-v0.2.0) → build a SIGNED Android TV / Fire TV APK from the
# BARE react-native-tvos project (tv/android is committed, unlike mobile's Expo-generated
# tree — no prebuild step needed here) and publish it to a GitHub Release for direct
# sideload install — no EAS account, Play Console, or Amazon Developer credentials required.
#
# This closes the "one asymmetry" the provisioning runbook used to document: TV previously
# had no direct-install path and its `tv-v*` tag went straight to EAS (release-tv.yml).
# Now TV mirrors mobile exactly:
#   - `tv-v*` tag           → THIS workflow → signed sideload APK on GitHub Releases.
#   - release-tv.yml        → manual (workflow_dispatch) only → EAS Build + Submit to
#                             Google Play (Android TV listing) and the tvOS App Store.
#   - Amazon Appstore (Fire TV) has no EAS Submit integration either way — Amazon reviewers
#     accept a plain signed APK, so the artifact this workflow publishes IS the one to
#     upload manually via the Amazon Developer Console (see fire-tv-submission.md).
#
# Signing uses the same Android Gradle Plugin "injected signing" properties as
# release-mobile-apk.yml (-Pandroid.injected.signing.*), which override whatever
# signingConfig tv/android/app/build.gradle declares (currently the committed debug
# keystore — fine, since injected signing replaces it at build time). The real keystore
# lives only in GitHub secrets (PRAYCALC_ANDROID_KEYSTORE_B64 + PRAYCALC_ANDROID_KEYSTORE_PASSWORD,
# alias `praycalc` — the SAME keystore/alias mobile uses; one org keystore, two apps).
on:
  push:
    tags: ['tv-v*']

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches tv/package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#tv-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tv/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .


      # No `expo prebuild` step here — tv/ is a BARE react-native-tvos project with
      # android/ already committed to the repo (gradlew, wrapper, debug.keystore, the lot).
      # Nothing to generate before Gradle runs.

      - name: Relax lintVital for the generated project (defensive — likely a no-op here)
        # Mobile needs this because `expo prebuild` regenerates per-locale strings.xml
        # with expo-localization's iOS-only NSLocation* keys, which Android lint's
        # ExtraTranslation check then flags as translated-but-missing-from-default-locale.
        # tv/ never runs expo prebuild (android/ is hand-committed, not Expo-generated) and
        # tv/package.json has no expo-localization dependency, so this specific failure
        # mode shouldn't occur. Appending the guard anyway costs nothing and protects
        # against a future contributor adding expo-localization or a similar i18n lib
        # that reproduces the same lint trip under tvOS's committed android/ tree.
        run: |
          printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          tail -8 android/app/build.gradle

      - name: Decode release keystore
        run: echo "${{ secrets.PRAYCALC_ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore

      - name: Gradle assembleRelease (injected signing)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PRAYCALC_ANDROID_KEYSTORE_PASSWORD }}
          # RN/Expo Gradle builds are memory-hungry on 7GB runners.
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          cd android
          # Mirror release-mobile-apk.yml's hard-won ordering lesson: generate every
          # autolinked library's codegen artifacts BEFORE :app's build references them,
          # since task-graph ordering doesn't reliably enforce this on its own and a
          # race here produces nondeterministic "not an existing directory" failures.
          # tv/ runs newArchEnabled=false (old architecture) per gradle.properties, so
          # this task may be a genuine no-op — some autolinked libs (async-storage) still
          # ship codegen specs consumed by the New Architecture codegen path even when
          # unused, and older RNGP versions can no-op or error depending on the exact
          # library set. `|| true` keeps this build resilient either way without masking
          # a real assembleRelease failure (that still fails the job below).
          ./gradlew generateCodegenArtifactsFromSchema --no-parallel || true
          # --no-parallel for the same reason as mobile: avoid the CMake-configure /
          # codegen race under parallel project execution.
          ./gradlew :app:assembleRelease --no-parallel \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=praycalc \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Collect + checksum artifact
        run: |
          VERSION="${GITHUB_REF_NAME#tv-v}"
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          cp "$APK" "/tmp/PrayCalc-TV-${VERSION}.apk"
          cd /tmp && shasum -a 256 "PrayCalc-TV-${VERSION}.apk" > "PrayCalc-TV-${VERSION}.apk.sha256"

      - name: Upload APK for the smoke gate
        uses: actions/upload-artifact@v7
        with:
          name: tv-apk
          path: |
            /tmp/PrayCalc-TV-*.apk
            /tmp/PrayCalc-TV-*.apk.sha256
          retention-days: 7
          if-no-files-found: error

  # Boot the APK that is about to be published on a real Android TV emulator and
  # assert it survives launch. v1.1.3 shipped and crashed on every cold start
  # (React 19 against react-native-tvos 0.74, which pins React 18.2.0) because
  # nothing between "gradle produced an APK" and "gh release create" ever ran it.
  # This job is that missing step. A red smoke means no release is published.
  smoke:
    name: Boot smoke before publishing
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: tv-apk
          path: /tmp

      - name: Boot Android TV emulator + install + launch + assert alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # No x86_64 Android TV system image exists below API 36; 33 and 34 ship
          # only x86 and arm64-v8a. 36 also matches the app's compileSdk/targetSdk.
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          # Single line: this action runs each line of `script` as its own `sh -c`,
          # so shell variables do not survive between lines.
          script: bash .github/scripts/tv-smoke.sh /tmp/PrayCalc-TV-*.apk

  publish:
    name: Publish GitHub Release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tv-apk
          path: /tmp

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#tv-v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PrayCalc TV ${VERSION} (Android TV / Fire TV)" \
            --notes "Direct-install Android APK (signed) for Android TV and Fire TV sideload: download, transfer to the device (adb install or a sideload app like Downloader), and allow the install prompt. Amazon Appstore (Fire TV) and Google Play (Android TV listing) submissions ship separately via the store pipelines (release-tv.yml, manual dispatch) — this release is the fast, no-store-review path. This APK was booted on an Android TV emulator and verified to survive launch before publishing." \
            --latest=false \
            "/tmp/PrayCalc-TV-${VERSION}.apk" "/tmp/PrayCalc-TV-${VERSION}.apk.sha256"
