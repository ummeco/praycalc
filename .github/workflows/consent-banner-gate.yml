# S05-12: Consent Banner Presence Gate — praycalc/web
#
# Fails PR if the root layout is missing the ConsentGate island, the island is
# missing ConsentProvider, or an unconditional Umami script is reintroduced.
#
# Astro migration note: the original check inspected web/app/layout.tsx (the
# Next.js root layout). That file no longer exists post D-P2-STACK-CANON —
# the gate now checks the Astro equivalents. See ADR-consent-banner-astro-gate.

name: Consent Banner Gate

on:
  push:
    branches: [main]
    paths:
      - 'web/src/layouts/RootLayout.astro'
      - 'web/src/islands/ConsentGate.tsx'
  pull_request:
    paths:
      - 'web/src/layouts/RootLayout.astro'
      - 'web/src/islands/ConsentGate.tsx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consent-banner-check:
    name: Consent banner presence check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check ConsentGate wiring in root layout
        run: |
          LAYOUT="web/src/layouts/RootLayout.astro"
          ISLAND="web/src/islands/ConsentGate.tsx"

          if [ ! -f "$LAYOUT" ]; then
            echo "::error::Root layout not found at $LAYOUT"
            exit 1
          fi
          if [ ! -f "$ISLAND" ]; then
            echo "::error::Consent island not found at $ISLAND"
            exit 1
          fi

          if ! grep -q "ConsentGate" "$LAYOUT"; then
            echo "::error file=$LAYOUT::[praycalc] Root layout missing <ConsentGate>. Mount the @ummat/consent island from web/src/islands/ConsentGate.tsx."
            exit 1
          fi
          echo "✓ ConsentGate mounted in root layout"

          if ! grep -q "ConsentProvider" "$ISLAND"; then
            echo "::error file=$ISLAND::[praycalc] ConsentGate missing ConsentProvider from @ummat/consent."
            exit 1
          fi
          echo "✓ ConsentProvider present"

          if grep -qiE 'src=["'"'"']?https://cloud\.umami\.is' "$LAYOUT"; then
            echo "::error file=$LAYOUT::[praycalc] Unconditional Umami script detected in root layout. Umami must load only via <ConsentGatedScript category=\"analytics\"> inside ConsentGate.tsx."
            exit 1
          fi
          echo "✓ No unconditional Umami script in root layout"

          if grep -qiE 'src=.*umami' "$ISLAND" && ! grep -q "ConsentGatedScript" "$ISLAND"; then
            echo "::error file=$ISLAND::[praycalc] Umami script must be wrapped in <ConsentGatedScript category=\"analytics\">."
            exit 1
          fi
          echo "✓ Umami script (if present) is consent-gated"
