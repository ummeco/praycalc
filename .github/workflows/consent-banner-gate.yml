# S05-12: Consent Banner Presence Gate — praycalc/web
#
# Fails PR if root layout is missing ConsentProvider or has unconditional Umami script.

name: Consent Banner Gate

on:
  push:
    branches: [main]
    paths:
      - 'web/app/layout.tsx'
  pull_request:
    paths:
      - 'web/app/layout.tsx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consent-banner-check:
    name: Consent banner presence check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ConsentProvider in root layout
        run: |
          LAYOUT="web/app/layout.tsx"
          if [ ! -f "$LAYOUT" ]; then
            echo "::error::Root layout not found at $LAYOUT"
            exit 1
          fi
          if ! grep -q "ConsentProvider" "$LAYOUT"; then
            echo "::error file=$LAYOUT::[praycalc] Root layout missing ConsentProvider. Wrap content in <ConsentProvider> from @ummat/consent."
            exit 1
          fi
          echo "✓ ConsentProvider present"

          if grep -qiE 'src=.*umami' "$LAYOUT"; then
            if ! grep -q "ConsentGatedScript" "$LAYOUT"; then
              echo "::error file=$LAYOUT::[praycalc] Unconditional Umami script detected. Use <ConsentGatedScript category=\"analytics\">."
              exit 1
            fi
            echo "✓ Umami script is consent-gated"
          else
            echo "✓ No unconditional Umami script"
          fi
