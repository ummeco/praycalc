name: TV Emulator Smoke (Android TV)

# Boots the latest released PrayCalc TV APK in an Android TV emulator and asserts
# the app process starts and stays alive. Deliberately NOT push-gated: emulator
# jobs are slow (~15 min) and occasionally flaky on shared runners, so this runs
# weekly + on demand and alerts via the normal failed-run bridge instead of
# blocking merges. (WTH plan Wave T3.)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  tv-smoke:
    name: Boot smoke on Android TV AVD
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest TV release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'PrayCalc-TV-*.apk' --dir /tmp \
            $(gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' | grep '^tv-v' | head -1)
          ls -la /tmp/PrayCalc-TV-*.apk

      - name: Boot Android TV emulator + install + launch + assert alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # api-level 36, NOT 33. Google publishes no x86_64 Android TV system
          # image below API 36: android-33 and android-34 ship only `x86` and
          # `arm64-v8a`. Requesting `system-images;android-33;android-tv;x86_64`
          # made sdkmanager warn "Failed to find package" and continue, so the
          # emulator never booted and the job failed at "adb emu kill" with
          # "could not connect to TCP port 5554". This workflow had never passed.
          # 36 also matches the TV app's compileSdk/targetSdk (tv/android/build.gradle).
          # Verify before changing: dl.google.com/android/repository/sys-img/android-tv/sys-img2-3.xml
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          # Single line on purpose. This action runs each line of `script` as its
          # own `sh -c`, so shell variables do not survive between lines. The
          # previous inline version assigned PKG on one line and read it on the
          # next, where it was always empty, and monkey then parsed the intent
          # category as its repeat count ("Count is not a number").
          script: bash .github/scripts/tv-smoke.sh /tmp/PrayCalc-TV-*.apk
