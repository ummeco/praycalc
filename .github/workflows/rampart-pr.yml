name: Rampart PR Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: rampart-${{ github.ref }}
  cancel-in-progress: true
env:
  RAMPART_ENFORCE: ${{ vars.RAMPART_ENFORCE || 'warn' }}
  RAMPART_GITLEAKS_VERSION: "8.30.0"
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks (version from env — NEVER hardcoded in the URL)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${RAMPART_GITLEAKS_VERSION}/gitleaks_${RAMPART_GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Scan (ALWAYS blocking — no warn mode for secrets)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --report-format json --report-path gitleaks-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gitleaks-report, path: gitleaks-report.json }
  deps-osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with: { scan-args: "--recursive --format json --output osv-report.json ." }
      - name: Gate on CVSS>=7
        run: node .github/scripts/rampart-gate.js osv-report.json --tool osv
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: osv-report, path: osv-report.json }
  deps-pnpm:
    runs-on: ubuntu-latest
    defaults:
      run:
        # JS package lives at web/ — no package.json at repo root (§3.3a item 7)
        working-directory: web/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit --prod --json > pnpm-audit.json || true
      - run: node ../.github/scripts/rampart-gate.js pnpm-audit.json --tool pnpm --baseline ../.github/rampart-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pnpm-audit-report, path: pnpm-audit.json }
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install semgrep==1.154.0
      - run: |
          semgrep --config p/typescript --config p/react --config p/owasp-top-ten \
                  --config p/secrets --config rules/rampart/ \
                  --json --output semgrep-report.json --error .
      - run: node .github/scripts/rampart-gate.js semgrep-report.json --tool semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: semgrep-report, path: semgrep-report.json }
  summary:
    needs: [secrets, deps-osv, deps-pnpm, sast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Aggregate + comment + gate
        run: node .github/scripts/rampart-summary.js artifacts/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
