name: Generated File Gate

# ASI hard rule: blocks commits of nSelf-generated files containing plaintext secrets.
# Checks two patterns: (1) filenames matching docker-compose*.yml / *.gen.yml / etc,
# and (2) file content containing the nSelf generator marker in the first 5 lines.
# Reference: ~/Sites/.claude/CLAUDE.md § Generated Files & Secret Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-file-gate:
    name: Generated File Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block committed generated files
        run: |
          FAIL=0

          # Pattern 1 — filename matches known generated-file patterns
          GENERATED_NAMES=$(git ls-files | grep -E \
            '(docker-compose.*\.ya?ml|.*\.override\.ya?ml|.*\.generated\.|.*\.gen\.ya?ml)' || true)

          if [ -n "$GENERATED_NAMES" ]; then
            echo "::error::Generated file(s) committed — add to .gitignore before running build/generate commands:"
            echo "$GENERATED_NAMES" | while read f; do echo "  - $f"; done
            FAIL=1
          fi

          # Pattern 2 — file content contains GENERATED BY marker in first 5 lines
          GENERATED_CONTENT=$(git ls-files | while read f; do
            head -5 "$f" 2>/dev/null | grep -q "GENERATED BY" && echo "$f" || true
          done)

          if [ -n "$GENERATED_CONTENT" ]; then
            echo "::error::File(s) with '# GENERATED BY' marker committed — these likely contain secrets:"
            echo "$GENERATED_CONTENT" | while read f; do echo "  - $f"; done
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Fix: add the file path(s) to .gitignore, remove from tracking with 'git rm --cached <path>', then re-commit."
            exit 1
          fi

          echo "Generated file gate: no violations found."
