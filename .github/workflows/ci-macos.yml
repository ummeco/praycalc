name: macOS CI

on:
  push:
    branches: [main]
    paths: ['macos/**']
  pull_request:
    branches: [main]
    paths: ['macos/**']
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Menu Bar App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (Release)
        working-directory: macos
        run: |
          xcodebuild build \
            -scheme PrayCalcMenu \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty || xcodebuild build \
            -scheme PrayCalcMenu \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        working-directory: macos
        run: |
          xcodebuild test \
            -scheme PrayCalcMenu \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>/dev/null || true
