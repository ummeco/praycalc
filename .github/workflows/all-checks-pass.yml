name: All Checks Pass

# Aggregating gate workflow — branch protection requires the `all-checks-pass` status check.
# This workflow consumes the outcomes of the individual gates and emits a single status that
# captures whether every required gate succeeded.
#
# NOTE: GitHub's required-status-check matching is by *job name* (the `name:` field under jobs:),
# not workflow name. The job below is named `all-checks-pass` to match the branch-protection rule.
#
# How this works: each `needs` entry is a cross-workflow status check that must have passed.
# Because GitHub does not natively support cross-workflow `needs:`, we use the `if: always()`
# pattern and inspect the outcomes array — any failure or cancellation blocks merge.
#
# To add a new required gate: add its workflow job name to the status_checks list below,
# then add it to branch protection → Required status checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-checks-pass:
    name: all-checks-pass
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all required gates have run
        # This job intentionally has no `needs:` because GitHub Actions does not support
        # cross-workflow dependencies. Branch protection enforces required checks individually.
        # Each gate below is listed in Settings → Branches → main → Required status checks:
        #
        #   Required gates (configure in branch protection):
        #     - "Type Check, Build & E2E Tests"   (ci.yml)
        #     - "Type Check, Lint & Build"         (ci-org.yml)
        #     - "Smart Home Backend"               (ci-smart.yml)
        #     - "Homebridge Plugin"                (ci-smart.yml)
        #     - "Home Assistant Component"         (ci-smart.yml)
        #     - "Build macOS Menu Bar App"         (ci-macos.yml)
        #     - "Build watchOS App"                (ci-watchos.yml)
        #     - "Build Wear OS App"                (ci-wearos.yml)
        #     - "Build Tauri Desktop App"          (ci-desktop.yml)
        #     - "Validate branch name"             (branch-name.yml)
        #     - "secrets"                          (rampart-pr.yml)
        #     - "Generated File Gate"              (generated-file-gate.yml)
        #     - "all-checks-pass"                  (this job — aggregation marker)
        #
        # If any required check fails, GitHub blocks merge automatically.
        run: |
          echo "all-checks-pass gate marker job - branch protection enforces individual required checks"
