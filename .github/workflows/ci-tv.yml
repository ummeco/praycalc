name: PrayCalc TV CI (react-native-tvos)

on:
  push:
    branches: [main]
    paths: ['tv/**']
  pull_request:
    branches: [main]
    paths: ['tv/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: tv
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tv
        run: pnpm typecheck

      - name: Lint
        working-directory: tv
        run: pnpm lint

      - name: Test
        working-directory: tv
        run: pnpm test --passWithNoTests --ci
