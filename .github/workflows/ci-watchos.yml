name: watchOS CI

on:
  push:
    branches: [main]
    paths: ['watchos/**', 'core/c/**']
  pull_request:
    branches: [main]
    paths: ['watchos/**', 'core/c/**']
  workflow_dispatch:

jobs:
  build:
    name: Build watchOS App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is gitignored; it is generated from watchos/project.yml.
      - name: Generate Xcode project
        working-directory: watchos
        run: xcodegen generate

      # macos-15 images may ship without the watchOS simulator runtime.
      - name: Ensure watchOS platform is installed
        run: xcodebuild -downloadPlatform watchOS || true

      - name: Build watchOS (Debug, no signing)
        working-directory: watchos
        run: |
          xcodebuild build \
            -project PrayCalc.xcodeproj \
            -scheme PrayCalcWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Real test gate (promoted from best-effort once WKWatchOnly made the
      # standalone app installable on simulators). Only skips when the runner
      # image genuinely has no watchOS simulator to boot.
      - name: Run unit tests
        working-directory: watchos
        run: |
          DEST=$(xcrun simctl list devices available 2>/dev/null \
            | grep -i 'Apple Watch' | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -n "$DEST" ]; then
            xcodebuild test \
              -project PrayCalc.xcodeproj \
              -scheme PrayCalcWatch \
              -destination "id=$DEST" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No watchOS simulator available on this runner image; skipping tests."
          fi
