# axe-core CI — reusable workflow (local copy)
# Sprint B9 DR-B9-A11Y-01 | Ticket TB9-17
# Source: /Volumes/UG/Sites/ummeco/.github/workflows/axe-ci-reusable.yml
# Keep in sync with the monorepo-root version.

name: axe-core CI (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Workspace-relative path to the Next.js project (e.g. praycalc/web)'
        required: true
        type: string
      port:
        description: 'Port the dev server listens on'
        required: false
        type: number
        default: 3000
      extra_urls:
        description: 'Space-separated list of additional paths to scan (e.g. /about /donate)'
        required: false
        type: string
        default: ''

jobs:
  axe:
    name: axe-core WCAG 2.1 AA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '${{ inputs.project_path }}/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ${{ inputs.project_path }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ inputs.project_path }}
        run: pnpm build

      - name: Start dev server
        working-directory: ${{ inputs.project_path }}
        # `pnpm dev` works for both project_path variants: web (output: 'server' +
        # @astrojs/vercel, which has no `astro preview`) and org (output: 'static',
        # where `astro preview` would also work, but dev keeps this step uniform).
        run: pnpm dev &

      - name: Wait for server
        env:
          AXE_PORT: ${{ inputs.port }}
        run: npx wait-on "http://localhost:${AXE_PORT}" -t 60000

      # @axe-core/cli bundles a `chromedriver` pinned to the latest Chrome stable,
      # which drifts out of sync with the runner's installed Chrome. When they
      # disagree the session comes up broken and axe fails with
      # "Cannot read properties of undefined (reading 'runPartial')" - axe-core
      # never finishes injecting. That is what started failing here between
      # 2026-09-01 (green) and 2026-09-04 (red) with no change to this repo:
      # the runner moved to Chrome 151. `which chromedriver` finds the bundled
      # mismatched binary, so pointing at it does not help.
      # nanasess/setup-chromedriver drops the driver matching THIS runner's
      # Chrome at /usr/local/bin/chromedriver. Same fix chatislam already uses.
      - name: Setup matching ChromeDriver
        uses: nanasess/setup-chromedriver@v3

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli
        # Make the bundled chromedriver npm package reuse the matched binary
        # rather than downloading its own (dequelabs/axe-core-npm#370).
        env:
          CHROMEDRIVER_FILEPATH: /usr/local/bin/chromedriver

      - name: Run axe — root route
        working-directory: ${{ inputs.project_path }}
        env:
          AXE_PORT: ${{ inputs.port }}
        run: |
          axe \
            "http://localhost:${AXE_PORT}" \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --chromedriver-path /usr/local/bin/chromedriver \
            --chrome-options="no-sandbox,disable-setuid-sandbox,disable-dev-shm-usage"

      - name: Run axe — extra routes
        if: ${{ inputs.extra_urls != '' }}
        working-directory: ${{ inputs.project_path }}
        env:
          AXE_PORT: ${{ inputs.port }}
          AXE_EXTRA_URLS: ${{ inputs.extra_urls }}
        run: |
          CHROMEDRIVER=/usr/local/bin/chromedriver
          for path in ${AXE_EXTRA_URLS}; do
            echo "--- axe: http://localhost:${AXE_PORT}${path} ---"
            axe \
              "http://localhost:${AXE_PORT}${path}" \
              --exit \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
              --chromedriver-path "$CHROMEDRIVER" \
              --chrome-options="no-sandbox,disable-setuid-sandbox,disable-dev-shm-usage"
          done
