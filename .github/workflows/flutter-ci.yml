name: PrayCalc Flutter CI

on:
  push:
    branches: [main]
    paths: ['flutter/**']
  pull_request:
    branches: [main]
    paths: ['flutter/**']

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies (app)
        working-directory: flutter
        run: flutter pub get
      - name: Get dependencies (pray_calc_dart)
        working-directory: flutter/packages/pray_calc_dart
        run: dart pub get
      - name: Analyze (app)
        working-directory: flutter
        run: flutter analyze
      - name: Analyze (pray_calc_dart)
        working-directory: flutter/packages/pray_calc_dart
        run: dart analyze
      - name: Validate pray_calc_dart VERSION matches pubspec
        working-directory: flutter/packages/pray_calc_dart
        run: |
          VERSION_FILE=$(cat VERSION | tr -d '[:space:]')
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          if [ "$VERSION_FILE" != "$PUBSPEC_VERSION" ]; then
            echo "VERSION file ($VERSION_FILE) does not match pubspec.yaml ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "VERSION check passed: $VERSION_FILE"
      - name: Unit tests — pray_calc_dart
        working-directory: flutter/packages/pray_calc_dart
        run: dart test
      - name: Widget tests — app
        working-directory: flutter
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > flutter/android/app/google-services.json
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build App Bundle (release)
        working-directory: flutter
        run: flutter build appbundle --release --flavor google -t lib/main.dart
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: praycalc-release-${{ github.sha }}
          path: flutter/build/app/outputs/bundle/googleRelease/app-google-release.aab
          retention-days: 14

  build-ios:
    name: Build iOS (Debug, no code sign)
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Inject GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > flutter/ios/Runner/GoogleService-Info.plist
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build iOS (no code sign)
        working-directory: flutter
        run: flutter build ios --no-codesign --debug
      - name: Upload iOS Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: praycalc-ios-debug-${{ github.sha }}
          path: flutter/build/ios/iphonesimulator/Runner.app
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build Windows
        working-directory: flutter
        run: flutter build windows --release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build macOS (debug)
        working-directory: flutter
        run: flutter build macos --debug

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pin CMake to 3.28 (avoids CMake 3.31 pkg_check_modules regression)
        run: pip3 install cmake==3.28.4 && echo "$(python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR)')" >> $GITHUB_PATH
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev libayatana-appindicator3-dev
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Patch flutter_secure_storage_linux CMakeLists (cmake 3.28 ARGN fix)
        run: |
          PLUGIN_DIR="flutter/linux/flutter/ephemeral/.plugin_symlinks/flutter_secure_storage_linux/linux"
          mkdir -p "$PLUGIN_DIR"
          cp flutter/linux/patches/flutter_secure_storage_linux_CMakeLists.txt "$PLUGIN_DIR/CMakeLists.txt"
      - name: Build Linux
        working-directory: flutter
        run: flutter build linux --release

  shorebird-patch-android:
    name: Shorebird Patch Android
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Shorebird
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH
      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > flutter/android/app/google-services.json
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Patch Android
        id: shorebird-android
        continue-on-error: true
        working-directory: flutter
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Comment on PR if patch failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Shorebird Android patch failed. Check the [CI logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

  shorebird-patch-ios:
    name: Shorebird Patch iOS
    runs-on: macos-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Shorebird
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH
      - name: Inject GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > flutter/ios/Runner/GoogleService-Info.plist
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Patch iOS
        id: shorebird-ios
        continue-on-error: true
        working-directory: flutter
        run: shorebird patch ios
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Comment on PR if patch failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Shorebird iOS patch failed. Check the [CI logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
