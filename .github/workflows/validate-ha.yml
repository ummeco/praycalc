name: Validate Home Assistant Integration

# hassfest validates the integration source nested at smart/homeassistant/ by staging it at
# the workspace root (the upstream action hard-mounts ${{ github.workspace }}).
#
# The hacs/action check does NOT run here: it validates the *remote GitHub repository
# structure* via the API (hacs.json at repo root, integration layout, brands, topics), which
# a monorepo can never satisfy. HACS distribution therefore lives in the dedicated mirror
# repo ummeco/praycalc-ha, where both hassfest and hacs/action run green on every push.
# Sync procedure: smart/homeassistant/HACS.md.

on:
  push:
    branches: [main]
    paths: ['smart/homeassistant/**']
  pull_request:
    paths: ['smart/homeassistant/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage integration at workspace root
        run: |
          cp -r smart/homeassistant /tmp/ha-staged
          rm -rf "${GITHUB_WORKSPACE:?}"/*
          cp -r /tmp/ha-staged/. "${GITHUB_WORKSPACE}/"
          ls -la "${GITHUB_WORKSPACE}"

      - uses: home-assistant/actions/hassfest@master
