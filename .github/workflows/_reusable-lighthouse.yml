# Lighthouse CI — reusable workflow (local copy)
# Sprint B9 DR-B9-PERF-01 | Ticket TB9-17
# Source: /Volumes/UG/Sites/ummeco/.github/workflows/lighthouse-ci-reusable.yml
# Keep in sync with the monorepo-root version.

name: Lighthouse CI (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
        description: 'Path to the Astro project (relative to repo root)'
      build_command:
        required: false
        type: string
        default: 'pnpm install && pnpm build'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '${{ inputs.project_path }}/pnpm-lock.yaml'
      - name: Install dependencies
        working-directory: ${{ inputs.project_path }}
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ${{ inputs.project_path }}
        run: pnpm build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Run Lighthouse CI
        working-directory: ${{ inputs.project_path }}
        run: lhci autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ inputs.project_path }}
          path: ${{ inputs.project_path }}/.lighthouseci
          # upload-artifact@v7 defaults include-hidden-files to false, which silently
          # drops the dot-directory .lighthouseci every time — the run then reports
          # 0 uploaded files with no error, exactly when a failing gate needs the
          # debugging artifact most (LH-05).
          include-hidden-files: true
          retention-days: 30
