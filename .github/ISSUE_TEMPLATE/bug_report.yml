name: Bug Report
description: Report a bug or unexpected behavior in PrayCalc
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: title
    attributes:
      label: Summary
      description: A short, clear description of the bug
      placeholder: e.g. Prayer times show incorrectly after midnight
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug clearly
      placeholder: Describe what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue
      placeholder: |
        1. Open the app
        2. Set location to...
        3. ...
    validations:
      required: true

  - type: input
    id: env_platform
    attributes:
      label: Platform / Device
      description: e.g. iPhone 15, Chrome on Windows, Android 14
      placeholder: e.g. iPhone 15 Pro, iOS 17.4
    validations:
      required: true

  - type: input
    id: env_version
    attributes:
      label: App / Browser version
      description: App version number or browser version
      placeholder: e.g. v2.3.1 or Chrome 124
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Attach screenshots or screen recordings if helpful (paste or drag here)
    validations:
      required: false
