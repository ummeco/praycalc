version: 2

# Dependabot configuration — ummeco/praycalc
# T02 p9-sprint-CI-PROD-READY: monthly dependency updates, no auto-merge.
# Ecosystems: npm (web/, org/, smart/) + gomod (N/A currently) + github-actions.
# Auto-merge is intentionally disabled — PRs require manual review per security policy.

updates:
  # npm — web app (Next.js)
  # npm — pnpm workspace root (covers web/, org/, mobile/, tv/, desktop/,
  # packages/*). It MUST be the root, not the individual members: pnpm keeps a
  # single lockfile at the workspace root, so a PR that bumps web/package.json
  # without touching that lockfile fails CI with ERR_PNPM_OUTDATED_LOCKFILE.
  # smart/ and homebridge/ stay separate below - they are genuinely standalone
  # and excluded from the workspace in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(deps)'

  # npm — smart server
  - package-ecosystem: npm
    directory: /smart
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(ci)'
