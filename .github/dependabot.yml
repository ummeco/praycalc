version: 2

# Dependabot configuration — ummeco/praycalc
# T02 p9-sprint-CI-PROD-READY: monthly dependency updates, no auto-merge.
# Ecosystems: npm (web/, org/, smart/) + gomod (N/A currently) + github-actions.
# Auto-merge is intentionally disabled — PRs require manual review per security policy.

updates:
  # npm — web app (Next.js)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(deps)'

  # npm — org docs site
  - package-ecosystem: npm
    directory: /org
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(deps)'

  # npm — smart server
  - package-ecosystem: npm
    directory: /smart
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    reviewers:
      - acamarata
    commit-message:
      prefix: 'chore(ci)'
