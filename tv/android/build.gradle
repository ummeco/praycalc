buildscript {
    ext {
        // API 36 (Android 16). Google Play requires every app UPDATE published from
        // 2026-08-31 to target 36; 35 only keeps an unchanged listing discoverable.
        // Pinned explicitly rather than inherited so a toolchain change cannot silently
        // drop it back below the floor.
        buildToolsVersion = "36.0.0"
        minSdkVersion = 23
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
