plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "expo.modules.wearbridge"
  // The release build evaluates every subproject through the com.facebook.react
  // plugin, which requires defaultConfig.versionName on library modules too —
  // without it `:app:assembleRelease` fails at configuration time.
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Wearable Data Layer API — DataClient.putDataItem must match the same GMS
  // wearable version family the wearos/ standalone app + PrayerDataListenerService
  // (WearableListenerService) already target.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
